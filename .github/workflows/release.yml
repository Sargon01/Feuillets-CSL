name: Release Plugin

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify release metadata
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          TAG="$TAG" node -e '
            const fs = require("node:fs");
            const tag = process.env.TAG;
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            const versions = JSON.parse(fs.readFileSync("versions.json", "utf8"));
            if (pkg.version !== tag || manifest.version !== tag) {
              throw new Error("Release version mismatch.");
            }
            if (versions[tag] !== manifest.minAppVersion) {
              throw new Error("versions.json mismatch.");
            }
          '

      - name: Run typecheck
        run: npm run typecheck

      - name: Run lint
        run: npm run lint

      - name: Run Obsidian review lint
        run: npm run lint:obsidian

      - name: Run tests
        run: npm test

      - name: Build plugin
        run: npm run build

      - name: Generate artifact attestations
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
          draft: false
          prerelease: false
          generate_release_notes: true
